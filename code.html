<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Google - Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#dae2ff",
                        "on-primary-fixed-variant": "#0040a1",
                        "primary-container": "#0b57d0",
                        "background": "#f6faff",
                        "surface-container": "#eaeef3",

                        "surface": "#f6faff",
                        "primary": "#0041a2",
                        "on-secondary-container": "#626564",
                        "inverse-on-surface": "#edf1f6",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e4e9ed",
                        "on-secondary-fixed": "#191c1b",
                        "surface-dim": "#d6dadf",
                        "outline": "#737785",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#e1e3e1",
                        "tertiary": "#802b00",
                        "inverse-primary": "#b2c5ff",
                        "surface-container-low": "#f0f4f9",
                        "on-primary-container": "#ced9ff",
                        "secondary-container": "#e1e3e1",
                        "inverse-surface": "#2c3135",
                        "on-background": "#171c20",
                        "surface-tint": "#0856cf",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#001847",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffdbce",
                        "on-tertiary-fixed-variant": "#7f2b00",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb599",
                        "surface-bright": "#f6faff",
                        "surface-variant": "#dfe3e8",
                        "outline-variant": "#c3c6d6",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#424654",
                        "on-secondary-fixed-variant": "#444746",
                        "on-tertiary-fixed": "#370e00",
                        "secondary-fixed-dim": "#c5c7c5",
                        "tertiary-container": "#a83b00",
                        "secondary": "#5c5f5e",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b2c5ff",
                        "on-tertiary-container": "#ffcfbe"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .focal-vessel {
            box-shadow: 0 24px 48px rgba(23, 28, 32, 0.05);
        }
        .glass-overlay {
            backdrop-filter: blur(12px);
        }
        input:focus + label,
        input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem) scale(0.85);
            color: #0041a2;
            background: white;
            padding: 0 4px;
        }
        .input-error {
            border-color: #ba1a1a !important;
            box-shadow: 0 0 0 2px rgba(186, 26, 26, 0.15);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-4">
<!-- Main Authentication Shell -->
<main class="w-full max-w-[1024px] grid grid-cols-1 md:grid-cols-2 bg-surface-container-lowest rounded-lg focal-vessel overflow-hidden">
<!-- Left Section: Brand Narrative -->
<section class="p-10 md:p-14 flex flex-col justify-start">
<div class="mb-8">
<!-- Google Logo Simulation -->
<svg height="48" viewbox="0 0 24 24" width="48" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
</div>
<h1 class="font-headline text-[2.5rem] leading-tight font-semibold mb-4 tracking-tight">
                Sign in
            </h1>
<p class="text-on-surface text-lg font-medium opacity-90">
                Use your Google Account
            </p>
<!-- Contextual Illustration or Decorative Element -->
<div class="mt-auto hidden md:block opacity-10">
<div class="w-64 h-64 rounded-full bg-primary-container blur-3xl absolute -left-20 -bottom-20"></div>
</div>
</section>
<!-- Right Section: Interaction Model -->
<section class="p-10 md:p-14 flex flex-col">
<form class="flex flex-col h-full">
<div class="relative mb-2">
<input class="peer w-full px-4 py-4 text-base border border-outline-variant/30 rounded-md focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none bg-transparent" id="email" name="email" placeholder=" " type="text"/>
<label class="absolute left-4 top-4 text-secondary text-base transition-all duration-200 pointer-events-none origin-left" for="email">
                        Email or phone
                    </label>
</div>
<p class="text-error text-sm mt-1 mb-6 hidden" id="email-error">Enter an email or phone number</p>
<div class="mb-10">
<button class="text-primary font-semibold text-sm hover:underline transition-all" type="button">
                        Forgot email?
                    </button>
</div>
<div class="mb-12">
<p class="text-secondary text-sm leading-relaxed">
                        Not your computer? Use Guest mode to sign in privately.
                        <a class="text-primary font-semibold hover:underline" href="#">Learn more</a>
</p>
</div>
<div class="mt-auto flex items-center justify-between">
<button class="text-primary font-semibold px-4 py-2 hover:bg-surface-container rounded-full transition-colors duration-200" type="button">
                        Create account
                    </button>
<button class="bg-gradient-to-r from-primary to-primary-container text-on-primary px-8 py-2.5 rounded-full font-semibold shadow-sm hover:shadow-md transition-all active:scale-95" id="next-button" type="submit">
                        Next
                    </button>
</div>
</form>
</section>
</main>
<!-- Footer: Shared Components Implementation -->
<footer class="fixed bottom-0 w-full flex flex-col md:flex-row justify-between items-center gap-6 px-10 py-6 bg-surface dark:bg-slate-950">
<!-- Language Selector (Left) -->
<div class="relative group">
<button class="flex items-center gap-2 text-secondary text-xs font-medium hover:text-on-surface transition-colors cursor-pointer">
<span>English (United States)</span>
<span class="material-symbols-outlined text-sm">arrow_drop_down</span>
</button>
<!-- Dropdown Simulation -->
<div class="absolute bottom-full left-0 mb-2 w-48 bg-surface-container-lowest rounded-md focal-vessel opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-opacity glass-overlay p-2">
<div class="px-3 py-2 text-xs hover:bg-surface-container rounded cursor-pointer">English (United Kingdom)</div>
<div class="px-3 py-2 text-xs hover:bg-surface-container rounded cursor-pointer">Español</div>
<div class="px-3 py-2 text-xs hover:bg-surface-container rounded cursor-pointer">Français</div>
</div>
</div>
<!-- Footer Links (Right) -->
<div class="flex gap-8">
<a class="text-secondary text-xs font-medium hover:text-on-surface hover:underline transition-all duration-200" href="#">Help</a>
<a class="text-secondary text-xs font-medium hover:text-on-surface hover:underline transition-all duration-200" href="#">Privacy</a>
<a class="text-secondary text-xs font-medium hover:text-on-surface hover:underline transition-all duration-200" href="#">Terms</a>
</div>
</footer>
<!-- Accessibility & Visual Polish: Top Bar (Suppress for Transactional Focus) -->
<!-- Note: TopAppBar from JSON is suppressed for this high-focus task-based page as per the Shell Visibility & Relevance mandate -->
<script>
  document.getElementById('next-button').addEventListener('click', function(e) {
    e.preventDefault();
    const emailInput = document.getElementById('email');
        const emailError = document.getElementById('email-error');
        const identity = emailInput.value.trim();

        emailInput.classList.remove('input-error');
        emailError.classList.add('hidden');

    if (identity) {
      localStorage.setItem('user_identity', identity);
            window.location.href = 'Login2.html';
    } else {
            emailInput.classList.add('input-error');
            emailError.classList.remove('hidden');
    }
  });

    document.getElementById('email').addEventListener('input', function() {
        this.classList.remove('input-error');
        document.getElementById('email-error').classList.add('hidden');
    });
</script></body></html>
